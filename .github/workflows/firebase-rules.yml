name: Firestore Rules publishing disabled

# Shared fant-e5ae5 Rules have no confirmed single owner or compatible release contract.
# Keep manual dispatch visible, but reject it before checkout, credentials, or publish.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules-publish-blocked:
    runs-on: ubuntu-latest
    steps:
      - name: Reject Rules publication
        run: |
          echo "::error::Shared Firestore Rules publication is disabled until one owner and both apps' compatibility gate are approved."
          exit 1
